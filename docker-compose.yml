version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: growthpro
      POSTGRES_PASSWORD: growthpro
      POSTGRES_DB: growthpro
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    command: celery -A app.worker worker --loglevel=info

volumes:
  pgdata:
